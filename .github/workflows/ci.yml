name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        # Fail the job if there are any ESLint errors or warnings
        run: yarn lint --max-warnings=0

      - name: Build
        run: yarn build

      - name: Upload production build as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public

  audit:
    name: Audit (Lighthouse + Pa11y)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: ./public

      - name: Start static server
        run: |
          npx -y http-server ./public -p 8080 -a 127.0.0.1 &

      - name: Wait for server to be ready
        run: npx -y wait-on http://127.0.0.1:8080

      - name: Create reports dir
        run: mkdir -p reports

      - name: Run Lighthouse (save JSON report)
        continue-on-error: true
        run: |
          npx -y lighthouse http://127.0.0.1:8080 --output=json --output-path=reports/lighthouse.json --chrome-flags="--no-sandbox --headless"

      - name: Run Pa11y (save JSON report)
        run: npx -y pa11y http://127.0.0.1:8080 --reporter json > reports/pa11y.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports
